# Install this reviewed file as .github/workflows/bootstrap-source.yml on the
# separate source-import-1.0.3 invocation branch. Both main and test must remain
# at EXPECTED_BASE. Run manually only after the source asset pins are filled.
# No release publication, merge, force push, or main update is performed.
name: Import reviewed 1.0.3 source into test

'on':
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: import-reviewed-1.0.3-source
  cancel-in-progress: false

env:
  EXPECTED_REPOSITORY: Wgeshow/optical-design-studio-updates
  EXPECTED_BASE: 876728351df6ea5b93d67c75e855184f0dc61a45
  SOURCE_ASSET: OpticalDesignStudio-Source-1.0.3.zip
  SOURCE_SHA256: 6cb0e542e7f189ff0b487ed952be9b2d8b5bfbbbbee8f5e537c0211ac1e55e64
  SOURCE_BYTES: 3616936
  SOURCE_FILE_COUNT: 748
  GH_HOST: github.com
  GH_PROMPT_DISABLED: '1'
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  import-source:
    if: >-
      github.repository == 'Wgeshow/optical-design-studio-updates' &&
      github.ref == 'refs/heads/source-import-1.0.3' &&
      github.event.repository.default_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Same pinned official checkout/setup actions as the existing workflow.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 876728351df6ea5b93d67c75e855184f0dc61a45
          persist-credentials: false
          fetch-depth: 1

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'

      - name: Require reviewed source pins and the exact main and test baseline
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "$EXPECTED_REPOSITORY"
          test "$GITHUB_REF" = 'refs/heads/source-import-1.0.3'
          test "$(git rev-parse HEAD)" = "$EXPECTED_BASE"
          test -z "$(git status --porcelain)"
          python - <<'PY'
          import json, os, re, subprocess
          if not re.fullmatch(r'[0-9a-f]{64}', os.environ['SOURCE_SHA256']):
              raise SystemExit('Fill the reviewed source SHA256 before running.')
          for key, limit in (('SOURCE_BYTES', 20 * 1024**2), ('SOURCE_FILE_COUNT', 5000)):
              value = os.environ[key]
              if not re.fullmatch(r'[1-9][0-9]*', value) or int(value) > limit:
                  raise SystemExit('Fill the reviewed source size and count before running.')
          repository = os.environ['EXPECTED_REPOSITORY']
          metadata = json.loads(subprocess.check_output(['gh', 'api', f'repos/{repository}']))
          if (metadata.get('full_name') != repository or metadata.get('private') is not True
                  or metadata.get('default_branch') != 'main'
                  or metadata.get('owner', {}).get('type') != 'User'):
              raise SystemExit('Expected the private personal development repository.')
          for branch in ('main', 'test'):
              ref = json.loads(subprocess.check_output(['gh', 'api', f'repos/{repository}/git/ref/heads/{branch}']))
              if (ref.get('ref') != f'refs/heads/{branch}'
                      or ref.get('object', {}).get('type') != 'commit'
                      or ref['object'].get('sha') != os.environ['EXPECTED_BASE']):
                  raise SystemExit(f'{branch} is not at the reviewed baseline. No branch will be updated.')
          PY
          git switch --create test

      - name: Download only the pinned source asset from a private draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source_download_dir=$(mktemp -d "$RUNNER_TEMP/optical-source-import.XXXXXX")
          gh api --paginate --slurp "repos/$EXPECTED_REPOSITORY/releases?per_page=100" > "$source_download_dir/releases.json"
          python - "$source_download_dir" <<'PY'
          import json, os, re, sys
          from pathlib import Path
          folder = Path(sys.argv[1])
          pages = json.loads((folder / 'releases.json').read_text())
          if not isinstance(pages, list) or any(not isinstance(page, list) for page in pages):
              raise SystemExit('Unexpected paginated release response.')
          candidates = []
          for release in (release for page in pages for release in page):
              if (release.get('draft') is not True
                      or release.get('name') != 'Optical Design Studio 1.0.3'
                      or release.get('target_commitish') not in ('main', 'test', os.environ['EXPECTED_BASE'])
                      or not re.fullmatch(r'(?:v1\.0\.3|untagged-[0-9a-f]{16,64})', str(release.get('tag_name', '')))
                      or type(release.get('id')) is not int or release['id'] <= 0):
                  continue
              matches = [item for item in release.get('assets', [])
                         if item.get('name') == os.environ['SOURCE_ASSET']]
              if (len(matches) == 1 and matches[0].get('state') == 'uploaded'
                      and type(matches[0].get('id')) is int and matches[0]['id'] > 0
                      and type(matches[0].get('size')) is int
                      and matches[0]['size'] == int(os.environ['SOURCE_BYTES'])
                      and matches[0].get('digest') == 'sha256:' + os.environ['SOURCE_SHA256']):
                  candidates.append((release, matches[0]))
          if len(candidates) != 1:
              raise SystemExit('Expected one matching private draft with the reviewed source asset, size and SHA256.')
          release, asset = candidates[0]
          (folder / 'asset-id').write_text(str(asset['id']))
          with Path(os.environ['GITHUB_ENV']).open('a', encoding='utf-8') as env:
              env.write(f"SOURCE_RELEASE_ID={release['id']}\n")
          PY
          source_asset_id=$(cat "$source_download_dir/asset-id")
          gh api "repos/$EXPECTED_REPOSITORY/releases/assets/$source_asset_id" --header 'Accept: application/octet-stream' > "$source_download_dir/$SOURCE_ASSET"
          printf 'SOURCE_ARCHIVE=%s/%s\n' "$source_download_dir" "$SOURCE_ASSET" >> "$GITHUB_ENV"

      - name: Verify all source paths before replacing only approved source files
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, os, re, shutil, stat, subprocess, zipfile
          from pathlib import Path, PurePosixPath

          root = Path(os.environ['GITHUB_WORKSPACE']).resolve()
          archive = Path(os.environ['SOURCE_ARCHIVE'])
          expected = os.environ['SOURCE_SHA256']
          if not re.fullmatch(r'[0-9a-f]{64}', expected):
              raise SystemExit('The source SHA256 has not been configured.')
          if archive.stat().st_size != int(os.environ['SOURCE_BYTES']):
              raise SystemExit('Source archive size does not match the reviewed asset.')
          with archive.open('rb') as stream:
              actual = hashlib.file_digest(stream, 'sha256').hexdigest()
          if actual != expected:
              raise SystemExit('Source SHA256 mismatch. No source was extracted.')
          allowed_dirs = {'src', 'packaging'}
          allowed_files = {'README.md', '.gitignore'}
          required = allowed_files | {
              'src/qt_app.py', 'src/qt_about.py', 'src/update_client.py',
              'src/update_credentials.py', 'src/app_version.py', 'src/desktop_runtime.py',
              'src/tests/test_update_client.py', 'src/tests/test_update_credentials.py',
              'src/tests/test_app_version.py', 'src/S4-source/COPYING',
              'src/S4-source/COPYRIGHT',
          }

          def approved(name):
              return name in allowed_files or (len(name.split('/')) > 1 and name.split('/')[0] in allowed_dirs)

          def checked_destination(parts):
              destination = root.joinpath(*parts)
              if not destination.resolve().is_relative_to(root):
                  raise SystemExit('Source destination escapes the repository.')
              for ancestor in (destination, *destination.parents):
                  if ancestor == root:
                      break
                  if ancestor.is_symlink():
                      raise SystemExit('An existing symlink blocks safe source extraction.')
              return destination

          seen, files, plan = set(), set(), []
          with zipfile.ZipFile(archive) as bundle:
              entries = bundle.infolist()
              if not entries or len(entries) > 5000:
                  raise SystemExit('Unexpected source archive entry count.')
              if sum(item.file_size for item in entries) > 20 * 1024**2:
                  raise SystemExit('Source archive expands beyond the size limit.')
              for item in entries:
                  name = item.filename
                  if (name != item.orig_filename or '\\' in name or ':' in name
                          or any(ord(char) < 32 or ord(char) == 127 for char in name)):
                      raise SystemExit('Source archive contains an unsafe filename.')
                  parts = name.rstrip('/').split('/')
                  if (not parts or any(part in ('', '.', '..') for part in parts)
                          or any(part.rstrip(' .') != part for part in parts)
                          or any(part.casefold() in {'.git', '.github'} for part in parts)):
                      raise SystemExit('Source archive contains a protected or noncanonical path.')
                  relative = PurePosixPath(*parts)
                  if not ((len(parts) > 1 and parts[0] in allowed_dirs)
                          or (len(parts) == 1 and parts[0] in allowed_files and not item.is_dir())
                          or (len(parts) == 1 and parts[0] in allowed_dirs and item.is_dir())):
                      raise SystemExit('Source archive contains a path outside the approved roots.')
                  normalized = relative.as_posix().casefold()
                  if normalized in seen:
                      raise SystemExit('Source archive contains duplicate or case-colliding paths.')
                  seen.add(normalized)
                  mode = item.external_attr >> 16
                  expected_type = stat.S_IFDIR if item.is_dir() else stat.S_IFREG
                  if (stat.S_IFMT(mode) not in (0, expected_type) or item.flag_bits & 1
                          or item.file_size > 20 * 1024**2):
                      raise SystemExit('Source archive contains links, special files, encryption, or an oversized file.')
                  destination = checked_destination(parts)
                  if destination.exists() and destination.is_dir() != item.is_dir():
                      raise SystemExit('An existing path conflicts with the source archive.')
                  if not item.is_dir():
                      files.add(relative.as_posix())
                  plan.append((item, destination, mode))
              if not required.issubset(files) or len(files) != int(os.environ['SOURCE_FILE_COUNT']):
                  raise SystemExit('Source files do not match the reviewed required files and count.')
              tracked = subprocess.check_output(['git', 'ls-files', '-z', '--',
                  'src', 'packaging', 'README.md', '.gitignore']).decode().split('\0')
              obsolete = []
              for name in filter(None, tracked):
                  if not approved(name):
                      raise SystemExit('Tracked source path is outside the approved roots.')
                  destination = checked_destination(PurePosixPath(name).parts)
                  if name not in files:
                      if not destination.is_file():
                          raise SystemExit('An obsolete tracked source path is not a regular file.')
                      obsolete.append(destination)
              # Every archive and old source path is validated before any writes.
              # Only obsolete tracked regular source files can be removed. No
              # recursive deletion, .github change, or Git metadata extraction.
              for destination in obsolete:
                  destination.unlink()
              for item, destination, mode in plan:
                  if item.is_dir():
                      destination.mkdir(parents=True, exist_ok=True)
                  else:
                      destination.parent.mkdir(parents=True, exist_ok=True)
                      with bundle.open(item) as source, destination.open('wb') as target:
                          shutil.copyfileobj(source, target, 1024 * 1024)
                      destination.chmod(0o755 if mode & 0o111 else 0o644)
          print(f'Verified {len(files)} source files; removed {len(obsolete)} obsolete tracked source files.')
          PY

      - name: Test anonymous public update client
        working-directory: src
        run: python -m unittest discover -s tests -p test_update_client.py -v

      - name: Test legacy credential helpers without accessing real credentials
        working-directory: src
        run: python -m unittest discover -s tests -p test_update_credentials.py -v

      - name: Test application version receipt
        working-directory: src
        run: python -m unittest discover -s tests -p test_app_version.py -v

      - name: Commit source locally and update only the unchanged test branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "$EXPECTED_REPOSITORY"
          test "$GITHUB_REF" = 'refs/heads/source-import-1.0.3'
          test "$(git symbolic-ref --quiet --short HEAD)" = 'test'
          test "$(git rev-parse HEAD)" = "$EXPECTED_BASE"
          python - <<'PY'
          import json, os, re, subprocess

          def approved(name):
              return name in {'README.md', '.gitignore'} or name.split('/')[0] in {'src', 'packaging'}

          changed = subprocess.check_output(['git', 'diff', '--name-only', '-z']).decode().split('\0')
          untracked = subprocess.check_output(['git', 'ls-files', '--others', '-z']).decode().split('\0')
          if any(not approved(name) for name in filter(None, changed + untracked)):
              raise SystemExit('Changes outside the approved source roots were detected.')
          subprocess.run(['git', 'add', '-A', '--', 'src', 'packaging', 'README.md', '.gitignore'], check=True)
          staged = subprocess.check_output(['git', 'diff', '--cached', '--name-only', '-z']).decode().split('\0')
          if not any(staged) or any(not approved(name) for name in filter(None, staged)):
              raise SystemExit('Expected reviewed source changes only.')
          repository = os.environ['EXPECTED_REPOSITORY']
          for branch in ('main', 'test'):
              ref = json.loads(subprocess.check_output(['gh', 'api', f'repos/{repository}/git/ref/heads/{branch}']))
              if (ref.get('ref') != f'refs/heads/{branch}'
                      or ref.get('object', {}).get('type') != 'commit'
                      or ref['object'].get('sha') != os.environ['EXPECTED_BASE']):
                  raise SystemExit(f'{branch} advanced. No branch will be updated.')
          release_id = os.environ.get('SOURCE_RELEASE_ID', '')
          if not re.fullmatch(r'[1-9][0-9]*', release_id):
              raise SystemExit('The verified source draft ID is missing.')
          release = json.loads(subprocess.check_output(['gh', 'api', f'repos/{repository}/releases/{release_id}']))
          if (release.get('id') != int(release_id) or release.get('draft') is not True
                  or release.get('name') != 'Optical Design Studio 1.0.3'):
              raise SystemExit('The selected source release is no longer the reviewed draft.')
          PY
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' -c core.hooksPath=/dev/null commit --quiet -m 'Prepare Optical Design Studio 1.0.3 public updater for review'
          test "$(git rev-parse HEAD^)" = "$EXPECTED_BASE"
          # Fast-forward only. A concurrent test update causes rejection; never
          # overwrite it, create test if missing, push main, or move a tag.
          git -c credential.helper= -c 'credential.helper=!gh auth git-credential' push origin HEAD:refs/heads/test
          source_commit=$(git rev-parse HEAD)
          printf 'Prepared source commit on test: `%s`\n\nOpen a pull request from test to main for review. Main and the draft release were not modified. Run Test update features manually on test if needed; repository-token pushes do not trigger another push workflow.\n' "$source_commit" >> "$GITHUB_STEP_SUMMARY"
