# One-time source import for this personal repository only. Run manually after
# uploading the reviewed source ZIP to the draft v1.0.2 release. Its reviewed
# SHA256 is pinned below. This never publishes a release or installs dependencies.
# Keep test-features.yml for future work on test and pull requests into main.
name: Import reviewed 1.0.2 source

'on':
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: import-reviewed-1.0.2-source
  cancel-in-progress: false

env:
  EXPECTED_REPOSITORY: Wgeshow/optical-design-studio-updates
  SOURCE_ASSET: OpticalDesignStudio-Source-1.0.2.zip
  SOURCE_SHA256: f76758767d8be46398e077d2e79e979a16702c15484f79fd52886441e0f32e8a
  GH_HOST: github.com
  GH_PROMPT_DISABLED: '1'
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  import-source:
    if: >-
      github.repository == 'Wgeshow/optical-design-studio-updates' &&
      github.ref == 'refs/heads/main' &&
      github.event.repository.default_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Official release v4.4.0, verified from actions/checkout's release page.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 1

      # Official release v6.3.0, verified from actions/setup-python's release page.
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'

      - name: Guard the personal repository and one-time import
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "$EXPECTED_REPOSITORY"
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$(git symbolic-ref --quiet --short HEAD)" = 'main'
          test -z "$(git status --porcelain)"
          if [ -n "$(git ls-files -- src native packaging)" ]; then
            echo 'Source already exists. This one-time importer will not replace subsequent work.' >&2
            exit 1
          fi
          python - <<'PY'
          import os, re
          if not re.fullmatch(r'[0-9a-f]{64}', os.environ['SOURCE_SHA256']):
              raise SystemExit('Replace SOURCE_SHA256 with the reviewed source archive hash before running.')
          PY

      - name: Download only the fixed draft source asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source_download_dir=$(mktemp -d "$RUNNER_TEMP/optical-source-import.XXXXXX")
          gh api "repos/$EXPECTED_REPOSITORY" > "$source_download_dir/repository.json"
          gh api --paginate --slurp "repos/$EXPECTED_REPOSITORY/releases?per_page=100" > "$source_download_dir/releases.json"
          python - "$source_download_dir" <<'PY'
          import json, os, re, sys
          from pathlib import Path
          folder = Path(sys.argv[1])
          repository = json.loads((folder / 'repository.json').read_text())
          if (repository.get('full_name') != os.environ['EXPECTED_REPOSITORY']
                  or repository.get('private') is not True
                  or repository.get('default_branch') != 'main'
                  or repository.get('owner', {}).get('type') != 'User'):
              raise SystemExit('Expected the private personal repository with main as its default branch.')
          pages = json.loads((folder / 'releases.json').read_text())
          if not isinstance(pages, list) or any(not isinstance(page, list) for page in pages):
              raise SystemExit('Unexpected paginated release response.')
          candidates = []
          for release in (release for page in pages for release in page):
              if (release.get('draft') is not True
                      or release.get('name') != 'Optical Design Studio 1.0.2'
                      or release.get('target_commitish') != 'main'
                      or not re.fullmatch(r'(?:v1\.0\.2|untagged-[0-9a-f]{16,64})', str(release.get('tag_name', '')))
                      or type(release.get('id')) is not int or release['id'] <= 0):
                  continue
              matches = [item for item in release.get('assets', [])
                         if item.get('name') == os.environ['SOURCE_ASSET']]
              if (len(matches) == 1 and matches[0].get('state') == 'uploaded'
                      and type(matches[0].get('id')) is int and matches[0]['id'] > 0
                      and type(matches[0].get('size')) is int and matches[0]['size'] == 3611332
                      and matches[0].get('digest') == 'sha256:' + os.environ['SOURCE_SHA256']):
                  candidates.append((release, matches[0]))
          if len(candidates) != 1:
              raise SystemExit('Expected exactly one matching private draft with the reviewed source asset, size and SHA256.')
          release, asset = candidates[0]
          (folder / 'asset-id').write_text(str(asset['id']))
          with Path(os.environ['GITHUB_ENV']).open('a', encoding='utf-8') as env:
              env.write(f"SOURCE_RELEASE_ID={release['id']}\n")
          PY
          source_asset_id=$(cat "$source_download_dir/asset-id")
          gh api "repos/$EXPECTED_REPOSITORY/releases/assets/$source_asset_id" --header 'Accept: application/octet-stream' > "$source_download_dir/$SOURCE_ASSET"
          printf 'SOURCE_ARCHIVE=%s/%s\n' "$source_download_dir" "$SOURCE_ASSET" >> "$GITHUB_ENV"

      - name: Verify and safely extract reviewed source
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, os, re, shutil, stat, zipfile
          from pathlib import Path, PurePosixPath

          root = Path(os.environ['GITHUB_WORKSPACE']).resolve()
          archive = Path(os.environ['SOURCE_ARCHIVE'])
          expected = os.environ['SOURCE_SHA256']
          if not re.fullmatch(r'[0-9a-f]{64}', expected):
              raise SystemExit('The source SHA256 has not been configured.')
          if not 0 < archive.stat().st_size <= 20 * 1024**2:
              raise SystemExit('Unexpected source archive size.')
          with archive.open('rb') as stream:
              actual = hashlib.file_digest(stream, 'sha256').hexdigest()
          if actual != expected:
              raise SystemExit('Source SHA256 mismatch. No source was extracted.')
          allowed_dirs = {'src', 'native', 'packaging'}
          allowed_files = {'README.md', '.gitignore'}
          required = allowed_files | {
              'src/qt_app.py', 'src/update_client.py', 'src/update_credentials.py',
              'src/app_version.py', 'src/desktop_runtime.py',
              'src/tests/test_update_client.py', 'src/tests/test_update_credentials.py',
              'src/tests/test_app_version.py',
          }
          seen = set()
          files = set()
          plan = []
          with zipfile.ZipFile(archive) as bundle:
              entries = bundle.infolist()
              if not entries or len(entries) > 5000:
                  raise SystemExit('Unexpected source archive entry count.')
              if sum(item.file_size for item in entries) > 20 * 1024**2:
                  raise SystemExit('Source archive expands beyond the size limit.')
              for item in entries:
                  name = item.filename
                  if (name != item.orig_filename or '\\' in name or ':' in name
                          or any(ord(char) < 32 or ord(char) == 127 for char in name)):
                      raise SystemExit('Source archive contains an unsafe filename.')
                  parts = name.rstrip('/').split('/')
                  if (not parts or any(part in ('', '.', '..') for part in parts)
                          or any(part.rstrip(' .') != part for part in parts)
                          or any(part.casefold() in {'.git', '.github'} for part in parts)):
                      raise SystemExit('Source archive contains a protected or noncanonical path.')
                  relative = PurePosixPath(*parts)
                  if not ((len(parts) > 1 and parts[0] in allowed_dirs)
                          or (len(parts) == 1 and parts[0] in allowed_files and not item.is_dir())
                          or (len(parts) == 1 and parts[0] in allowed_dirs and item.is_dir())):
                      raise SystemExit('Source archive contains a path outside the approved source roots.')
                  normalized = relative.as_posix().casefold()
                  if normalized in seen:
                      raise SystemExit('Source archive contains duplicate or case-colliding paths.')
                  seen.add(normalized)
                  mode = item.external_attr >> 16
                  file_type = stat.S_IFMT(mode)
                  expected_type = stat.S_IFDIR if item.is_dir() else stat.S_IFREG
                  if (file_type not in (0, expected_type) or item.flag_bits & 1
                          or item.file_size > 20 * 1024**2):
                      raise SystemExit('Source archive contains links, special files, encryption, or an oversized file.')
                  destination = root.joinpath(*parts)
                  if not destination.resolve().is_relative_to(root):
                      raise SystemExit('Source destination escapes the repository.')
                  for ancestor in (destination, *destination.parents):
                      if ancestor == root:
                          break
                      if ancestor.is_symlink():
                          raise SystemExit('An existing symlink blocks safe source extraction.')
                  if destination.exists() and destination.is_dir() != item.is_dir():
                      raise SystemExit('An existing path conflicts with the source archive.')
                  if not item.is_dir():
                      files.add(relative.as_posix())
                  plan.append((item, destination, mode))
              if not required.issubset(files):
                  raise SystemExit('The source archive lacks required application or test files.')
              if len(files) != 746:
                  raise SystemExit('Expected exactly the 746 reviewed source files.')
              # Validate every path before writing any file. .github and .git
              # are never extracted, removed, staged, or replaced by this step.
              for item, destination, mode in plan:
                  if item.is_dir():
                      destination.mkdir(parents=True, exist_ok=True)
                  else:
                      destination.parent.mkdir(parents=True, exist_ok=True)
                      with bundle.open(item) as source, destination.open('wb') as target:
                          shutil.copyfileobj(source, target, 1024 * 1024)
                      destination.chmod(0o755 if mode & 0o111 else 0o644)
          print(f'Verified and extracted {len(files)} approved source files.')
          PY

      - name: Test private update client
        working-directory: src
        run: python -m unittest discover -s tests -p test_update_client.py -v

      - name: Test credential handling without accessing real credentials
        working-directory: src
        run: python -m unittest discover -s tests -p test_update_credentials.py -v

      - name: Test application version receipt
        working-directory: src
        run: python -m unittest discover -s tests -p test_app_version.py -v

      - name: Commit reviewed source and create test only if absent
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "$EXPECTED_REPOSITORY"
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$(git symbolic-ref --quiet --short HEAD)" = 'main'
          python - <<'PY'
          from pathlib import Path
          import subprocess
          roots = [name for name in ('src', 'native', 'packaging', 'README.md', '.gitignore') if Path(name).exists()]
          subprocess.run(['git', 'add', '--', *roots], check=True)
          staged = subprocess.check_output(['git', 'diff', '--cached', '--name-only', '-z']).decode().split('\0')
          for name in filter(None, staged):
              if name not in {'README.md', '.gitignore'} and name.split('/')[0] not in {'src', 'native', 'packaging'}:
                  raise SystemExit('Unexpected staged path; source commit stopped.')
          PY
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' -c core.hooksPath=/dev/null commit --quiet -m 'Import reviewed Optical Design Studio 1.0.2 source'
          # The repository token is present only for these authenticated steps;
          # checkout did not persist it for source code or tests to read.
          git -c credential.helper= -c 'credential.helper=!gh auth git-credential' push origin HEAD:refs/heads/main
          import_commit=$(git rev-parse HEAD)
          if gh api "repos/$EXPECTED_REPOSITORY/git/ref/heads/test" --silent 2>/dev/null; then
            echo 'The existing test branch was preserved.'
          elif gh api --method POST "repos/$EXPECTED_REPOSITORY/git/refs" --raw-field 'ref=refs/heads/test' --raw-field "sha=$import_commit" --silent; then
            echo 'Created test at the reviewed source commit.'
          elif gh api "repos/$EXPECTED_REPOSITORY/git/ref/heads/test" --silent 2>/dev/null; then
            echo 'The test branch was created concurrently and was preserved.'
          else
            echo 'Source was pushed to main, but test could not be created. No existing branch was changed.' >&2
            exit 1
          fi
          printf 'Imported source commit: `%s`\n\nThe v1.0.2 release remains a draft. Existing workflows were preserved.\n' "$import_commit" >> "$GITHUB_STEP_SUMMARY"

      - name: Check draft release target without moving a tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, re, subprocess
          from pathlib import Path

          repository = 'Wgeshow/optical-design-studio-updates'
          if os.environ['GITHUB_REPOSITORY'] != repository:
              raise SystemExit('Unexpected repository.')
          commit = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()

          def api(path):
              result = subprocess.run(['gh', 'api', f'repos/{repository}/{path}'],
                                      capture_output=True, text=True)
              if result.returncode:
                  # Distinguish a genuinely absent reference from access/network errors.
                  if '(HTTP 404)' in result.stderr:
                      return None
                  raise SystemExit('Unable to verify the draft release and tag through this repository API.')
              return json.loads(result.stdout)

          release_id = os.environ.get('SOURCE_RELEASE_ID', '')
          if not re.fullmatch(r'[1-9][0-9]*', release_id):
              raise SystemExit('The selected draft release ID is missing or invalid.')
          release = api('releases/' + release_id)
          if (not release or release.get('id') != int(release_id)
                  or release.get('name') != 'Optical Design Studio 1.0.2'
                  or not re.fullmatch(r'(?:v1\.0\.2|untagged-[0-9a-f]{16,64})', str(release.get('tag_name', '')))
                  or release.get('draft') is not True):
              raise SystemExit('The selected release is missing or no longer the expected draft. No tag was changed.')
          reference = api('git/ref/tags/v1.0.2')
          if reference is not None:
              obj = reference.get('object', {})
              for _ in range(10):
                  if obj.get('type') != 'tag':
                      break
                  tag = api('git/tags/' + str(obj.get('sha', '')))
                  if not tag:
                      raise SystemExit('The existing annotated tag could not be resolved.')
                  obj = tag.get('object', {})
              if obj.get('type') != 'commit' or obj.get('sha') != commit:
                  raise SystemExit('Existing v1.0.2 tag does not point to the imported source commit. It was preserved; review the tag before publishing.')
              message = 'Existing v1.0.2 tag already identifies the imported source commit.'
          else:
              if release.get('target_commitish') not in ('main', commit):
                  raise SystemExit('The draft target differs from main/imported commit. Set its target to the imported source commit before publishing; no tag was changed.')
              message = ('No v1.0.2 tag exists yet. Before publishing, select this exact source commit '
                         'as the draft target (or confirm main has not advanced).')
          print(message)
          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a', encoding='utf-8') as summary:
              summary.write(f'\n{message}\n\nRelease source commit: `{commit}`\n')
          PY
